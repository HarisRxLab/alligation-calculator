name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bunx vite build --base /alligation-calculator/ --outDir dist/spa

      - name: Generate index.html from built assets
        run: |
          BASE="/alligation-calculator"
          OUT="dist/spa/client"
          # Find built JS and CSS files
          JS=$(ls $OUT/assets/index-*.js 2>/dev/null | head -1 | xargs basename)
          CSS=$(ls $OUT/assets/styles-*.css 2>/dev/null | head -1 | xargs basename)
          echo "JS=$JS  CSS=$CSS"
          cat > $OUT/index.html <<HTML
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Alligation Calculator</title>
              <link rel="stylesheet" crossorigin href="$BASE/assets/$CSS" />
            </head>
            <body>
              <div id="root"></div>
              <script type="module" crossorigin src="$BASE/assets/$JS"></script>
            </body>
          </html>
          HTML
          echo "=== index.html ==="
          cat $OUT/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/spa/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
