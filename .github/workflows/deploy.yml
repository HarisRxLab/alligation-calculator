name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: List build output
        run: |
          echo "=== dist/ ==="
          ls -la dist/ || true
          echo "=== dist/client/ ==="
          ls -la dist/client/ || true
          echo "=== dist/client/assets/ ==="
          ls -la dist/client/assets/ || true

      - name: Generate index.html for static hosting
        run: |
          # Find the main JS entry file
          JS_FILE=$(ls dist/client/assets/index-*.js 2>/dev/null | head -1 | xargs -I{} basename {})
          CSS_FILE=$(ls dist/client/assets/styles-*.css 2>/dev/null | head -1 | xargs -I{} basename {})
          echo "JS: $JS_FILE"
          echo "CSS: $CSS_FILE"
          cat > dist/client/index.html << EOF
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Alligation Calculator</title>
              <script>window.__BASE_PATH__ = '/alligation-calculator/';</script>
              $([ -n "$CSS_FILE" ] && echo "<link rel=\"stylesheet\" href=\"/alligation-calculator/assets/$CSS_FILE\" />" || true)
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/alligation-calculator/assets/$JS_FILE"></script>
            </body>
          </html>
          EOF
          echo "Generated index.html:"
          cat dist/client/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
