name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Show build output
        run: find dist -type f | head -50

      - name: Start server and capture pre-rendered HTML
        run: |
          # Find the server entry
          SERVER_FILE=$(find dist/server -name '*.js' | head -1)
          echo "Server file: $SERVER_FILE"
          # Start server in background
          PORT=3000 bun $SERVER_FILE &
          SERVER_PID=$!
          sleep 5
          # Try multiple URLs
          echo "Trying http://localhost:3000/"
          HTML=$(curl -s -L http://localhost:3000/ 2>&1)
          echo "Got $(echo $HTML | wc -c) bytes"
          echo "First 200 chars: ${HTML:0:200}"
          # Save the HTML
          mkdir -p dist/static
          echo "$HTML" > dist/static/index.html
          # Copy client assets
          cp -r dist/client/assets dist/static/assets 2>/dev/null || true
          # Rewrite asset paths to include base path
          sed -i 's|/assets/|/alligation-calculator/assets/|g' dist/static/index.html
          echo "=== Final index.html (first 500 chars) ==="
          head -c 500 dist/static/index.html
          kill $SERVER_PID 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/static

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
