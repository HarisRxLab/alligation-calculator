name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Pre-render index.html via server
        run: |
          # Start the server briefly to get the rendered HTML for the root path
          timeout 10 bun dist/server/server.js &
          SERVER_PID=$!
          sleep 3
          curl -s http://localhost:3000/alligation-calculator/ > dist/client/index.html || \
          curl -s http://localhost:3000/ > dist/client/index.html || true
          kill $SERVER_PID 2>/dev/null || true
          echo "=== Generated index.html ==="
          head -20 dist/client/index.html || echo "Failed to generate"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
