name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Find and verify output directory
        run: |
          echo "=== All dist contents ==="
          find dist -type f | head -40
          echo "=== Checking for index.html ==="
          find dist -name "index.html" || echo "No index.html found"

      - name: Determine deploy folder and upload
        run: |
          if [ -f dist/public/index.html ]; then
            echo "Using dist/public"
            echo "DEPLOY_DIR=dist/public" >> $GITHUB_ENV
          elif [ -f dist/static/index.html ]; then
            echo "Using dist/static"
            echo "DEPLOY_DIR=dist/static" >> $GITHUB_ENV
          elif [ -f dist/client/index.html ]; then
            echo "Using dist/client"
            echo "DEPLOY_DIR=dist/client" >> $GITHUB_ENV
          else
            echo "No index.html found in standard dirs, checking all..."
            find dist -name "index.html"
            echo "DEPLOY_DIR=dist/client" >> $GITHUB_ENV
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DEPLOY_DIR }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
