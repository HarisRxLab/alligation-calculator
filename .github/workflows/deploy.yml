name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Start server and capture SSR HTML
        run: |
          mkdir -p dist/static
          # Copy client assets (they already have /alligation-calculator/ base baked in)
          cp -r dist/client/assets dist/static/assets
          # Start the SSR server
          PORT=3000 bun dist/server/server.js &
          SERVER_PID=$!
          sleep 5
          # Curl the root path
          curl -s http://localhost:3000/ -o dist/static/index.html
          echo "=== HTML size ==="
          wc -c dist/static/index.html
          echo "=== First 600 chars ==="
          head -c 600 dist/static/index.html
          kill $SERVER_PID 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/static

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
